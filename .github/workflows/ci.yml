# CI — push · PR 마다 테스트. 깨진 코드가 main 에 들어가기 전에 빨간불로 막음
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 워크플로 전체의 기본 권한 — 코드 읽기만
permissions:
  contents: read

# 같은 브랜치에 연달아 push 하면 앞의 실행은 취소 · 마지막 것만 끝까지
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # JDK 21 (Temurin) — 내 PC 와 같은 버전
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성 · 빌드 캐시를 러너 사이에 보관 → 두 번째부터 빨라짐
      - uses: gradle/actions/setup-gradle@v6

      - name: 테스트
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      # 실패했을 때만 테스트 보고서를 내려받을 수 있게 남김 (7일)
      - name: 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7