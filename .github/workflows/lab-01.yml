name: lab-01
on:
  push:
    paths:
      - .github/workflows/lab-01.yml
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-24.04
    steps:
      - name: 인사
        run: echo "첫 워크플로 실행 성공"
        # TODO [1-1] 러너의 커널 정보와 CPU 개수를 출력하는 스텝을 추가합니다.
      - name: 러너 정보
        run: |
          uname -a
          nproc
        # TODO [1-2] 현재 작업 폴더의 파일 목록을 출력하는 스텝을 추가합니다.
      - name: 받기 전 폴더 목록
        run: ls -la
        # TODO [1-3] 저장소 코드를 러너로 받아 온 뒤, 다시 파일 목록을 출력합니다.
      - name: 코드 받기
      - uses: actions/checkout@v7
      - name: 받아온 파일 목록
        run: ls -la