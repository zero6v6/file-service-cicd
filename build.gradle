plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '1.3.0'
description = 'file-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    awsSdkVersion = '2.31.59'
}

dependencies {
    // 웹 요청 처리. board-app-infra-lecture 와 같은 스타터.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 생존 확인(/actuator/health)과 빌드 정보(/actuator/info).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AWS SDK for Java 2.x — 버전은 BOM 하나로 맞춤.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'

    // 파일 목록을 DB 에. local 은 H2(메모리), prod 는 RDS MySQL.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 목록 캐시. local 은 메모리(simple), prod 는 ElastiCache(Valkey · Redis 프로토콜).
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 파일 이벤트 기록. prod 는 DynamoDB (같은 AWS SDK BOM).
    implementation 'software.amazon.awssdk:dynamodb'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// /actuator/info 의 build 항목(version · time)을 만듦. 배포 후 "어느 버전이 떠 있나"를 여기서 확인함.
springBoot {
    buildInfo()
}

tasks.named('test') {
    useJUnitPlatform()
}
