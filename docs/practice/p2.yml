name: p2-환경변수
on:
  push:
    paths:
      - .github/workflows/p2.yml
  workflow_dispatch:
env:
  STAGE: workflow
jobs:
  no-job-env:
    runs-on: ubuntu-24.04
    steps:
      - name: 워크플로 층만 있음
        run: echo "STAGE=$STAGE"
  with-job-env:
    runs-on: ubuntu-24.04
    env:
      STAGE: job
    steps:
      - name: 잡 층까지 있음
        run: echo "STAGE=$STAGE"
      - name: 스텝 층까지 있음
        env:
          STAGE: step
        run: echo "STAGE=$STAGE"