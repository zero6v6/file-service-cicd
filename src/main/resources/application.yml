server:
  port: 8080

spring:
  application:
    name: file-service
  profiles:
    # 값을 지정하지 않으면 local 로 동작함.
    # 서버(EC2 · 컨테이너)에서는 SPRING_PROFILES_ACTIVE=prod 를 지정해 기동함.
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    # 응답을 만드는 동안 DB 연결을 잡고 있지 않음 (경고 제거)
    open-in-view: false
  data:
    redis:
      repositories:
        # Redis 는 캐시로만 씀 · 리포지토리는 JPA 만 (기동 로그의 strict mode 안내 제거)
        enabled: false
  servlet:
    multipart:
      # 멀티파트 상한. 넘기면 컨트롤러에 닿기 전에 413 으로 거부됨.
      max-file-size: 10MB
      max-request-size: 12MB

app:
  upload:
    # FileValidator 가 쓰는 업무 상한(바이트). 멀티파트 상한보다 작게 둠. 10MB
    max-bytes: 10485760
  presign:
    # 프리사인 URL 유효 시간(초). 5분
    ttl-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    build:
      enabled: true
  health:
    redis:
      # 캐시는 선택 저장소. health 에 넣으면 캐시 장애가 ALB unhealthy → 인스턴스 교체로 번짐
      enabled: false
